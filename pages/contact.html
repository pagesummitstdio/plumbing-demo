<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Plumbing Website - Contact</title>
    <link rel="icon" type="image/x-icon" href="Resources/images/plumbing_website_logo/plumbing-logo.png">
    <link rel="stylesheet" type="text/css" href="Resources/css/style.css"/>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="A plumber with years of experience capable of getting lots of jobs done.">
    <meta name="author" content="Page Summit"/>
    <meta name="keywords" content="Business, Construction, Plumbing, Repair, Maintenance, Remodeling, Issues, Tools, Handyman, Houston, Texas, United States">
  </head>

  <body>
    <header class="nav-bar">
      <a href="/index.html" class="left-nav">
        <img src="Resources/images/plumbing_website_logo/plumbing-logo.png" id="logo" alt="Plumber Website Logo"/>
        <strong class="page-title">Plumber Website</strong>
      </a>

      <nav class="nav-container" id="nav-menu">
        <ul class="center-nav">
          <li class="nav-links"><a href="#home">Home</a></li>
          <li class="nav-links"><a href="#about">About</a></li>
          <li class="nav-links"><a href="#services">Services</a></li>
          <li class="nav-links"><a href="#portfolio">Portfolio</a></li>
        </ul>

        <div class="right-nav">
          <a href="contact.html" class="contact-button">Contact Us</a>
        </div>
      </nav>
      
      <button id="phone-nav-btn">☰</button>
    </header>

    <main class="contact-page">
      <a href="/index.html">Back to Home</a>

      <section></section>

      <section>
        <form autocomplete="on">
          <section class="personal-info">
            <h3>Personal Information</h3>  
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" placeholder="Jane" autocomplete="given-name" required>

            <br>

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" placeholder="Doe" autocomplete="family-name" required>
          </section>
            
          <br>

          <section class="contact-info">
            <h3>Contact Information</h3>
            <label for="phone-number">Phone Number:</label>
            <input 
              type="tel" 
              id="phone-number" 
              name="phone-number" 
              placeholder="+1 (555) 000-0000" 
              autocomplete="tel" 
              pattern="[0-9()+\-\s]{10,20}" 
              required>

            <br>
            
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="jane.doe@example.com" autocomplete="email" required>

            <br>
            
            <fieldset>
              <legend>Preferred Contact Method:</legend>
              <input type="radio" id="phone-method" name="preferred-contact-method" value="phone" required/>
              <label for="phone-method">Phone</label>
              <input type="radio" id="text-method" name="preferred-contact-method" value="text"/>
              <label for="text-method">Text</label>
              <input type="radio" id="email-method" name="preferred-contact-method" value="email"/>
              <label for="email-method">Email</label>
            </fieldset>
          </section>

          <br>

          <section class="service-address">
            <h3>Service Address</h3>
            <label for="street-address">Street Address:</label>
            <input type="text" id="street-address" name="street-address" placeholder="123 Main St" autocomplete="address-line1" required>

            <br>

            <label for="apt-or-suite">Apt/Suite:</label>
            <input type="text" id="apt-or-suite" name="apt-or-suite" placeholder="Apt 4B" autocomplete="address-line2">

            <br>

            <label for="zip-code">Zip-Code:</label>
            <input type="text" id="zip-code" name="zip-code" placeholder="12345" autocomplete="postal-code" required> 
          </section>

          <br>

          <section class="issue-description">
            <label for="message">Describe the Issue:</label><br>
            <textarea 
              id="message"
              name="message"
              placeholder="Type your detailed message here..."
              rows="5"
              minlength="10"
              maxlength="500"
              required></textarea>
          </section>

            <button type="submit" id="submit-btn">
              <span>Contact Us</span>
            </button>
        </form>
      </section>
    </main>

    <footer class="footer-section"> <!-- Styles: width (viewport), background color, or border.-->
      <div class="footer-wrap"> <!-- Used strictly for layout (text, links, logos)-->
        <section class="office-footer-section">
          <div class="office-footer-section-wrap">
            <h4>Office</h4>
            <address>
              <a href="mailto:page.summit.stdio@gmail.com">page.summit.stdio@gmail.com</a><br />
              <a href="tel:+19568155821">+1 (956) 815-5821</a>
            </address>
          </div>
        </section>
        
        <section class="links-footer-section">
          <div class="links-footer-section-wrap">
            <h4>Links</h4>
            <ul>
              <li class="nav-links"><a href="/index.html">Home</a></li>
              <li class="nav-links"><a href="/#about">About</a></li>
              <li class="nav-links"><a href="/#services">Services</a></li>
              <li class="nav-links"><a href="/#portfolio">Portfolio</a></li>
            </ul>
          </div>
        </section>
      </div>
    </footer>
    <script src="Resources/js/script.js"></script>
  </body>
</html>
